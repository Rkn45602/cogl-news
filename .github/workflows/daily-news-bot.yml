name: Daily Autonomous World News Bot (4 PM - 6 PM)

on:
  schedule:
    # Runs daily at 11:00 UTC (4:30 PM IST, within 4:00 PM - 6:00 PM window)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Autonomous World News Bot
        run: node bot/runBot.js

      - name: Commit & Push Researched News
        run: |
          git config --global user.name "COGL News Bot"
          git config --global user.email "bot@coglmedia.com"
          git add config/articles.json config/settings.json config/bot-log.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-published Top 10 World News [skip ci]" && git push origin main)
