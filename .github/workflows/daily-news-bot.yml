name: Daily Autonomous Trending Wire Bot (20 Stories: 10 Global + 10 India)

on:
  schedule:
    # Runs daily at 11:00 UTC (4:30 PM IST, within 4:00 PM - 6:00 PM window)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Autonomous 20-Story Wire Bot
        run: node bot/runBot.js 20

      - name: Commit & Push Researched News
        run: |
          git config --global user.name "COGL News Bot"
          git config --global user.email "bot@coglmedia.com"
          git add config/articles.json public/articles.json config/settings.json config/bot-log.json config/used-images.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-published 20 Trending Stories (10 Global + 10 India) [skip ci]" && git push origin main)
